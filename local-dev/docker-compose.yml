# educoding 로컬 실행용 인프라 (tour 프로젝트의 6379/5432와 안 겹치게 포트 분리)
name: educoding-local
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: educoding
      MYSQL_DATABASE: educoding
      MYSQL_USER: educoding
      MYSQL_PASSWORD: educoding
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3307:3306"]
    volumes: [mysql-data:/var/lib/mysql]
  redis:
    image: redis:7
    command: redis-server --requirepass educoding
    ports: ["6380:6379"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [es-data:/usr/share/elasticsearch/data]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  mysql-data:
  es-data:
